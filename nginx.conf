server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The API runs as the compose service "api". Docker's resolver is used so nginx starts even if
    # the API container is not up yet, and re-resolves it after the API is recreated by a deploy.
    resolver 127.0.0.11 valid=10s;
    set $api http://api:8080;

    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # POST /api/ask can run for up to 90 s while the model works.
        proxy_read_timeout 120s;
    }

    # Hashed build output never changes under the same name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/parts, /login, ...) fall back to the app shell. Never cache it, so a
    # deploy is picked up on the next load.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
