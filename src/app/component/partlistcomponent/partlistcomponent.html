<div class="header-area">
  <h1>Part List</h1>
  <app-profile-component class="profile-component"></app-profile-component>
</div>
<div class="table-area">
  <div [ngClass]="isShowFilter ? 'filter-tab' : 'filter-tab-no-border'">
    <button matMiniFab (click)="onClickFilter()">
      <mat-icon>filter_alt</mat-icon>
    </button>
    <div
      [ngStyle]="isShowFilter ? null : { display: 'none' }"
      class="ml-2 filter-item"
    >
      <input
        class="search-input"
        type="text"
        placeholder="Pcb ref."
        [(ngModel)]="pcbList"
      />

      <input
        class="search-input"
        type="text"
        placeholder="Value"
        [(ngModel)]="value"
      />

      <button class="search-button" matButton="elevated" (click)="onSearch()">
        Search
      </button>
    </div>
  </div>
  <table
    mat-table
    [dataSource]="dataSource"
    class="mat-elevation-z8"
    matSort
    matSortActive="id"
    matSortDisableClear
    matSortDirection="desc"
  >
    <ng-container matColumnDef="pcb-ref">
      <th mat-header-cell *matHeaderCellDef>Pcb ref.</th>
      <td mat-cell *matCellDef="let element">{{ element.pcb_ref }}</td>
    </ng-container>

    <ng-container matColumnDef="part_number">
      <th mat-header-cell *matHeaderCellDef>Part number</th>
      <td mat-cell *matCellDef="let element">{{ element.part_number }}</td>
    </ng-container>

    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef>Description</th>
      <td mat-cell *matCellDef="let element">{{ element.description }}</td>
    </ng-container>

    <ng-container matColumnDef="type">
      <th mat-header-cell *matHeaderCellDef>Type</th>
      <td mat-cell *matCellDef="let element">{{ element.type }}</td>
    </ng-container>

    <ng-container matColumnDef="values">
      <th mat-header-cell *matHeaderCellDef>Value</th>
      <td mat-cell *matCellDef="let element">{{ element.value }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</div>

<div class="paginator-area">
  <mat-paginator
    #paginator
    class="demo-paginator"
    (page)="handlePageEvent($event)"
    [length]="length"
    [pageSize]="pageSize"
    [pageIndex]="pageIndex"
    [pageSizeOptions]="pageSizeOptions"
    aria-label="Select page"
  >
  </mat-paginator>
</div>
