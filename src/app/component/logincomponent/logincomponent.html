<div class="table-area">
  <!-- <div class="ml-2 filter-item">
   

    <button class="search-button" matButton="elevated">Log in</button>
  </div> -->
  <mat-card class="card-body" appearance="outlined">
    <mat-card-header class="card-title">
      <mat-card-title>Login</mat-card-title>
    </mat-card-header>
    <mat-form-field class="input-field">
      <input
        matInput
        type="text"
        placeholder="Username or email"
        [(ngModel)]="userName"
      />
    </mat-form-field>
    <mat-form-field class="input-field">
      <input
        matInput
        type="text"
        placeholder="Password"
        [(ngModel)]="password"
      />
    </mat-form-field>
    <mat-card-actions class="button-field">
      <button matButton="filled" (click)="onClickLogin()">Log in</button>
    </mat-card-actions>
  </mat-card>
</div>
